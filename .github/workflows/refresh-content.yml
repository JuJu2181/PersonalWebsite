name: Refresh Pinterest & Blog Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Pinterest photos
        run: node scripts/fetch-pinterest-photos.js

      - name: Fetch blog posts
        run: node scripts/fetch-blog-posts.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/pinterest-data.js js/blog-data.js
          git diff --staged --quiet || git commit -m "chore: auto-refresh Pinterest & blog data"
          git push
